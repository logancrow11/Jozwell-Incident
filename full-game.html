function chart(){
 const n=PROMPTS.length,TC=["#B4BCC2","#9CD3F5","#FF6B6B","#B48CFF","#FFD24A"];
 const Wd=360,Ht=420,L=46,R=12,T=16,B=42,W=Wd-L-R,H=Ht-T-B;
 const top=Math.max(...TIERS.map(t=>t.pts))*M,mx=top*1.12;
 const Y=m=>T+m/mx*H,X=k=>L+(k+.5)*W/n;
 const step=top<=100?25:top<=200?50:Math.ceil(top/4/50)*50;
 const s=`<svg viewBox="0 0 ${Wd} ${Ht}" width="100%" role="img" aria-label="Chart of how deep each answer took you"><defs>
 <linearGradient id="wt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient>
 <filter id="gl" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur in="SourceGraphic" stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
`;
 let defs="",body=`<rect x="${L}" y="${T}" width="${W}" height="${H}" rx="8" fill="url(#wt)"/>`;
 for(let m=0;m<=top;m+=step)body+=`<line x1="${L}" x2="${L+W}" y1="${Y(m)}" y2="${Y(m)}" stroke="#fff" stroke-opacity=".14"/><text x="${L-6}" y="${Y(m)+4}" text-anchor="end" font-size="11" fill="#cfe3ea">${m} m</text>`;
 log.forEach((r,k)=>{const x=X(k),m=r.m;
  body+=`<text x="${x}" y="${Ht-24}" text-anchor="middle" font-size="11" fill="#cfe3ea">${k+1}</text>`;
  if(!r.hit||!m){body+=`<circle cx="${x}" cy="${T+9}" r="5" fill="none" stroke="#B4BCC2" stroke-dasharray="2 2"><title>No score</title></circle>`;return}
  const c=TC[r.hit.tier]||TC[0],y=Y(m);
  defs+=`<linearGradient id="tr${k}" gradientUnits="userSpaceOnUse" x1="0" y1="${T}" x2="0" y2="${y}"><stop offset="0" stop-color="${c}" stop-opacity="0"/><stop offset="1" stop-color="${c}" stop-opacity=".7"/></linearGradient>`;
  body+=`<line x1="${x}" x2="${x}" y1="${T}" y2="${y-10}" stroke="url(#tr${k})" stroke-width="3" stroke-linecap="round"/>
  ${chartIcon(r.hit.tier,x,y,c,k,r.ans,m)}
  <text x="${x}" y="${y+32}" text-anchor="middle" font-size="11" font-weight="600" fill="${c}">${m}</text>`});
 return s+defs+`</defs>`+body+`<text x="${L+W/2}" y="${Ht-6}" text-anchor="middle" font-size="12" fill="#cfe3ea">Question</text></svg>`}

 const cnt=$("#cnt");let skipped=false;const fin=()=>{cnt.textContent=depth};

 else setTimeout(()=>{const t0=performance.now();const step=n=>{if(skipped||!cnt.isConnected)return fin();
  const p=Math.min((n-t0)/1400,1);cnt.textContent=Math.round(depth*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)},1100);
 const pt=[4,3,2][k];if(pt)setTimeout(()=>{if($(".vt"))ping(pt)},2600);
 $(".verdict").onclick=e=>{if(e.target.id==="seeres")return;skipped=true;fin();app.classList.add("ff")};

function icon(t,px){
 if(t===5)return `<svg class="ico" width="${px}" height="${px}" viewBox="-18 -18 36 36" aria-hidden="true"><use href="#ic5" x="-18" y="-18" width="36" height="36"/></svg>`;
 const PS=[bratSrc,britSrc,georgeSrc,georgeSrc,photoSrc];
 if(t<=1&&!PS[t])return `<svg class="ico" width="${px}" height="${px}" viewBox="-18 -18 36 36" aria-hidden="true"><use href="#ic${t}" x="-18" y="-18" width="36" height="36"/></svg>`;
 const src=PS[t],c=TCOL[t];
 return `<img class="ico rnd${t===3?" bounce":""}" src="${src}" alt="" style="width:${px}px;height:${px}px;border-color:${c};box-shadow:0 0 ${Math.round(px/4)}px ${c}99">`}
function chartIcon(t,x,y,c,k,ans,m){
 const tip=`<title>${esc(ans)}, ${m} m</title>`;
 const PS=[bratSrc,britSrc,georgeSrc,georgeSrc,photoSrc];
 if(t<=1&&!PS[t])return `<g transform="translate(${x} ${y})" filter="url(#gl)">${tip}<circle r="18" fill="${c}" fill-opacity=".2"/><g transform="scale(1.1)"><use href="#ic${t}" x="-18" y="-18" width="36" height="36"/></g></g>`;
 const src=PS[t];
 return `<g transform="translate(${x} ${y})" filter="url(#gl)">${tip}<g class="${t===3?"bounce":""}"><circle r="18" fill="${c}" fill-opacity=".22"/><clipPath id="cp${k}"><circle r="14"/></clipPath><image href="${src}" x="-14" y="-14" width="28" height="28" preserveAspectRatio="xMidYMid slice" clip-path="url(#cp${k})"/><circle r="14" fill="none" stroke="${c}" stroke-width="2.4"/></g></g>`}

/* ---------- atmosphere: sound, specks, vignette, mute ---------- */
let AC=null,master=null,ambFilter=null,pingBus=null,muted=false;
try{muted=localStorage.getItem("jozz-mute")==="1"}catch(_){}
function audioStart(){
 if(AC){if(AC.state==="suspended")AC.resume();return}
 const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
 AC=new C();master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);
 const len=AC.sampleRate*3,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let last=0;
 for(let k=0;k<len;k++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[k]=last*3.5}
 const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
 ambFilter=AC.createBiquadFilter();ambFilter.type="lowpass";ambFilter.frequency.value=520;ambFilter.Q.value=.7;
 const g=AC.createGain();g.gain.value=.4;
 const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.08;lg.gain.value=110;lfo.connect(lg);lg.connect(ambFilter.frequency);
 src.connect(ambFilter);ambFilter.connect(g);g.connect(master);src.start();lfo.start();
 pingBus=AC.createGain();const dl=AC.createDelay(1),fb=AC.createGain();dl.delayTime.value=.34;fb.gain.value=.38;
 pingBus.connect(master);pingBus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(master);
 bubbleLoop();setAtmos();
 if(AC.state==="suspended")AC.resume()}
function bubble(){if(!AC||muted||AC.state!=="running")return;
 const t=AC.currentTime,f=220+Math.random()*380,o=AC.createOscillator(),g=AC.createGain();
 o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*2.2,t+.09);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.14);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+.2)}
function bubbleLoop(){bubble();setTimeout(bubbleLoop,1500+Math.random()*4500)}
function ping(tier){if(!AC||muted||!pingBus)return;
 const seq=tier>=4?[988,1318,1760]:tier===3?[988,1318]:[988];
 seq.forEach((f,k)=>{const t=AC.currentTime+k*.22,o=AC.createOscillator(),g=AC.createGain();
  o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+1.4);
  o.connect(g);g.connect(pingBus);o.start(t);o.stop(t+1.5)})}
function setAtmos(){const t=Math.min(depth/MAX,1)||0,v=$("#vig");
 if(v)v.style.opacity=(.12+.8*Math.pow(t,.7)).toFixed(2);
 if(AC&&ambFilter)ambFilter.frequency.setTargetAtTime(Math.max(150,520-360*t),AC.currentTime,1.2)}
function muteBtn(){
 const b=document.createElement("button");b.id="mute";document.body.appendChild(b);
 const ON='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
 const OFF='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
 const paint=()=>{b.innerHTML=muted?OFF:ON;b.setAttribute("aria-label",muted?"Unmute sound":"Mute sound");b.setAttribute("aria-pressed",String(muted))};
 b.onclick=()=>{muted=!muted;try{localStorage.setItem("jozz-mute",muted?"1":"0")}catch(_){}paint();audioStart();if(master)master.gain.setTargetAtTime(muted?0:1,AC.currentTime,.05)};
 paint()}
function specks(){
 if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 const c=document.createElement("canvas");c.id="specks";c.setAttribute("aria-hidden","true");document.body.appendChild(c);
 const x=c.getContext("2d");let W=0,H=0,dpr=1;const N=innerWidth<600?55:90,P=[];
 const size=()=>{dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+"px";c.style.height=H+"px"};
 size();addEventListener("resize",size);
 for(let k=0;k<N;k++)P.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.8,z:.25+Math.random()*.75,a:.12+Math.random()*.35,v:3+Math.random()*7,w:.2+Math.random()*.6,p:Math.random()*6.28});
 let sd=0;const t0=performance.now();
 const frame=now=>{const t=(now-t0)/1000;sd+=((depth||0)-sd)*.035;
  x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  const surf=Math.min(innerWidth,800)*.3+12-sd*PPM;
  for(const q of P){const y=((q.y*H-sd*PPM*q.z+t*q.v)%H+H)%H;if(y<surf)continue;
   x.globalAlpha=q.a;x.fillStyle="#DDF3F7";x.beginPath();x.arc(q.x*W+Math.sin(t*q.w+q.p)*10,y,q.r,0,6.283);x.fill()}
  requestAnimationFrame(frame)};
 requestAnimationFrame(frame)}
const vg=document.createElement("div");vg.id="vig";document.body.appendChild(vg);
muteBtn();specks();
["pointerdown","touchend","click","keydown"].forEach(e=>addEventListener(e,audioStart,{once:true}));
