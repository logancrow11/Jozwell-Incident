<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Jozzwell Incident</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#eaf4f7;--dim:#a5c0cc;--foam:#7fd6c8;--amber:#ffd24a;--rose:#ff9bae;--sea:#06293a;--depth:0;box-sizing:border-box}*,*::before,*::after{box-sizing:inherit}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#164f69 0%,#092d44 55%,#061b2a 100%);color:var(--ink);font:18px/1.45 "Instrument Sans",sans-serif;transition:background 1s}body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 0%,rgba(205,247,255,.2),transparent 56%),radial-gradient(ellipse at 50% 100%,rgba(0,0,0,calc(.15 + var(--depth)*.65)),transparent 70%);z-index:-1}main{width:min(100%,660px);margin:auto;padding:clamp(28px,8vh,76px) 22px 56px}h1,h2,.big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;line-height:1.02;margin:0;letter-spacing:0}h1{font-size:clamp(42px,10vw,72px)}h2{font-size:30px}p{margin:12px 0}.hero{display:grid;gap:12px;margin-bottom:28px}.subtitle{font-weight:700;font-size:13px;letter-spacing:.22em;color:var(--amber);margin:0}.tag{font-style:italic;color:var(--dim);max-width:34ch}.lede,.sub,.note{color:var(--dim)}.lede{max-width:40ch;margin:16px 0 26px}.note{font-size:14px}.diver{width:76px;height:76px;border-radius:50%;border:3px solid var(--amber);background:#12455b;object-fit:cover;box-shadow:0 0 20px #ffd24a66}.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--dim)}.depth{font:800 32px "Bricolage Grotesque",sans-serif;color:var(--ink)}.air{height:8px;background:#ffffff22;border-radius:99px;overflow:hidden;margin-bottom:36px}.air i{display:block;width:100%;height:100%;background:var(--foam);transition:width .15s linear}.air.low i{background:var(--rose)}.prompt{font-size:clamp(30px,7vw,44px);margin-bottom:24px}.answer{width:100%;font:500 24px "Instrument Sans",sans-serif;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--dim);padding:8px 0;margin:4px 0 20px;border-radius:0}.answer::placeholder{color:#eaf4f766}button{font:700 16px "Instrument Sans",sans-serif;background:var(--foam);color:#06293a;border:0;border-radius:8px;padding:13px 18px;cursor:pointer}button.ghost{background:transparent;color:var(--ink);border:1px solid #a5c0ccaa}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:3px}.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.chip{display:inline-block;font-weight:700;padding:4px 11px;border-radius:99px;background:#0005;margin:8px 0}.t0{color:#c2cbd0}.t1{color:#9cd3f5}.t2{color:#ff7777}.t3{color:#ffd24a}.gain{font:800 64px "Bricolage Grotesque",sans-serif;margin:0 0 5px}.row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-top:1px solid #ffffff25}.row small{color:var(--dim)}.editor{background:#0003;border-radius:10px;padding:16px;margin:18px 0}.editor label{display:block;color:var(--dim);font-size:14px;margin:12px 0}.editor input,.editor textarea{display:block;width:100%;font:16px "Instrument Sans",sans-serif;color:var(--ink);background:#ffffff12;border:1px solid #ffffff35;border-radius:6px;padding:9px;margin-top:5px}.scroll{background:#f4ecdd;color:#10222b;border-radius:12px;padding:20px 22px}.scroll .subtitle{color:#8a3b1e}.story{font:700 21px/1.4 "Bricolage Grotesque",sans-serif}.topline{display:flex;align-items:center;gap:16px}.hidden{display:none!important}.depthline{height:1px;background:#ffffff35;margin:30px 0;position:relative}.depthline::after{content:"";position:absolute;left:0;top:-2px;width:34px;height:4px;background:var(--amber);border-radius:0 5px 5px 0}@media(max-width:440px){main{padding-top:32px}.btns button{flex:1 1 auto}.diver{width:62px;height:62px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
.tier-badge{display:inline-grid;place-items:center;vertical-align:middle;width:48px;height:48px;margin:12px 0 4px;border:2px solid currentColor;border-radius:50%;background:#06293a;color:var(--amber);font-weight:800;overflow:hidden}.tier-badge img{grid-area:1/1;width:100%;height:100%;object-fit:cover}.tier-badge span{grid-area:1/1}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const TIERS=[{id:"plankton",name:"Brat",points:10},{id:"mackerel",name:"Britney",points:30},{id:"anglerfish",name:"George",points:60},{id:"abyssal",name:"Jozzkrillion",points:100}];
const DEFAULTS=[
 {q:"Name a currency of the world.",plankton:"Dollar/US Dollar, Euro, Pound/Sterling, Yen",mackerel:"Yuan/Renminbi, Rupee, Peso, Franc, Ruble/Rouble, Won",anglerfish:"Rand, Real, Krona, Krone, Lira, Dinar, Dirham, Baht, Shekel, Zloty",abyssal:"Ngultrum, Ouguiya, Dalasi, Lilangeni, Vatu, Tala, Paanga, Denar, Ariary"},
 {q:"Name a dog breed.",plankton:"Labrador Retriever/Labrador/Lab, Golden Retriever/Golden, German Shepherd, Poodle, Beagle, French Bulldog/Frenchie",mackerel:"Corgi, Dachshund, Rottweiler, Boxer, Chihuahua, Border Collie, Pomeranian, Siberian Husky",anglerfish:"Basset Hound, Papillon, Shiba Inu, Whippet, Samoyed, Bloodhound, Weimaraner",abyssal:"Azawakh, Chinook, Sloughi, Otterhound, Bergamasco, Cesky Terrier"},
 {q:"Name a programming language.",plankton:"Python, Java, JavaScript/JS, C, C++, C#",mackerel:"Visual Basic/VB, Fortran, Scratch, SQL, Rust, Go/Golang",anglerfish:"Swift, Ada, Julia, Kotlin, Ruby, TypeScript, Haskell",abyssal:"Zig, Elixir, Erlang, Racket, Brainfuck, Smalltalk"},
 {q:"Name a US state.",plankton:"California, Texas, Florida, New York, Pennsylvania",mackerel:"Illinois, Ohio, Georgia, Michigan, New Jersey, Virginia",anglerfish:"Massachusetts, Colorado, Wisconsin, Louisiana, Oregon",abyssal:"Montana, Rhode Island, Delaware, Alaska, Vermont, Wyoming"},
 {q:"Name a fruit.",plankton:"Banana, Watermelon, Apple, Orange, Grape",mackerel:"Mango, Pineapple, Peach, Pear, Plantain",anglerfish:"Persimmon, Pomegranate, Lychee, Quince, Passion Fruit",abyssal:"Durian, Mangosteen, Rambutan, Loquat, Cherimoya, Yuzu"}
];
const KEY="jozzwell-game-v1";
const app=document.querySelector("#app");
let prompts=structuredClone(DEFAULTS),seconds=25,question=0,depth=0,results=[],timer=null,visitedIntro=false;
try{const saved=JSON.parse(localStorage.getItem(KEY)||"null");if(saved?.prompts?.length){prompts=saved.prompts;seconds=saved.seconds||25}}catch{}
const escapeHtml=value=>String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
const normalize=value=>value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\+/g," plus ").replace(/#/g," sharp ").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim().replace(/^the /,"");
const allAnswers=prompt=>TIERS.flatMap((tier,index)=>(prompt[tier.id]||"").split(",").flatMap(item=>item.split("/").map((name,aliasIndex)=>({name:name.trim(),label:item.split("/")[0].trim(),tier:index})).filter(answer=>answer.name)));
function findAnswer(value,prompt){const input=normalize(value);if(!input)return null;return allAnswers(prompt).find(answer=>normalize(answer.name)===input)||null}
function setDepth(){document.body.style.setProperty("--depth",Math.min(depth/(prompts.length*100),1).toFixed(2))}
function diver(size=76){return `<img class="diver" src="photo.jpg" alt="" style="width:${size}px;height:${size}px" onerror="this.remove()">`}
function tierBadge(tier){const files=["brat.jpg","britney.jpg","george.jpeg","photo.jpg"];const initials=["B","B","G","J"];return `<span class="tier-badge t${tier}"><span>${initials[tier]}</span><img src="${files[tier]}" alt="" onerror="this.remove()"></span>`}
function home(){app.innerHTML=`<section class="hero">${diver()}<h1>THE JOZZWELL INCIDENT</h1><p class="subtitle">THE DIVE TO THE TRUTH</p></section><p class="tag">Some things were never meant to be discovered.</p><p class="lede">${prompts.length} prompts. ${seconds} seconds each. Common answers barely count. Rare ones take you deeper.</p><div class="btns"><button id="start">Start diving</button><button class="ghost" id="edit">Edit game</button></div>`;document.querySelector("#start").onclick=()=>visitedIntro?beginGame():intro();document.querySelector("#edit").onclick=editor}
function intro(){visitedIntro=true;app.innerHTML=`<section class="scroll"><p class="subtitle">PROLOGUE</p><p class="story">Years ago there was an incident so unspeakable that it had to be pushed to the depths of the world.<br><br>500 years later, you explorers will have the chance to uncover this great mystery.</p></section><div class="btns"><button id="begin">Begin the dive</button></div>`;document.querySelector("#begin").onclick=beginGame}
function beginGame(){question=0;depth=0;results=[];setDepth();play()}
function play(){clearInterval(timer);const current=prompts[question];let remaining=seconds;app.innerHTML=`<div class="hud"><span>Prompt ${question+1} of ${prompts.length}</span><span class="depth">${depth} m</span></div><div class="air" id="air"><i></i></div><h2 class="prompt">${escapeHtml(current.q)}</h2><form id="answerForm"><input id="answer" class="answer" autocomplete="off" placeholder="Your answer" aria-label="Your answer"><p class="sub" id="feedback" role="status" style="min-height:1.5em"></p><button>Lock in answer</button></form><p class="note">Your remaining air drains away on the bar above.</p>`;const field=document.querySelector("#answer");field.focus();const submit=event=>{event?.preventDefault();const answer=field.value.trim();if(!answer){document.querySelector("#feedback").textContent="Type an answer first.";return}const hit=findAnswer(answer,current);if(!hit){document.querySelector("#feedback").textContent="That answer isn't on the list. Try another.";field.value="";field.focus();return}clearInterval(timer);reveal(answer,hit)};document.querySelector("#answerForm").onsubmit=submit;const started=Date.now();timer=setInterval(()=>{remaining=seconds-(Date.now()-started)/1000;const bar=document.querySelector("#air");if(!bar){clearInterval(timer);return}bar.querySelector("i").style.width=Math.max(remaining/seconds*100,0)+"%";bar.classList.toggle("low",remaining<8);if(remaining<=0){clearInterval(timer);reveal(field.value.trim(),null)}},100)}
function reveal(answer,hit){const points=hit?TIERS[hit.tier].points:0;depth+=points;setDepth();results.push({question:prompts[question].q,answer,hit,points});const next=question===prompts.length-1?"See your results":"Next prompt";app.innerHTML=`<div class="hud"><span>Prompt ${question+1} of ${prompts.length}</span><span class="depth">${depth} m</span></div>${hit?`${tierBadge(hit.tier)}<br><span class="chip t${hit.tier}">${TIERS[hit.tier].name}</span><div class="gain t${hit.tier}">+${points} m</div><p class="sub">You said ${escapeHtml(answer)}.${normalize(answer)!==normalize(hit.label)?` Counted as ${escapeHtml(hit.label)}.`:""}</p>`:`<span class="chip">Not on the list</span><div class="gain">+0 m</div><p class="sub">${answer?`You said ${escapeHtml(answer)}.`:"No answer in time."}</p>`}<div class="btns"><button id="next">${next}</button>${!hit&&answer?'<button class="ghost" id="accept">Count it anyway</button>':''}</div>`;document.querySelector("#next").onclick=()=>{question++;question===prompts.length?finish():play()};const accept=document.querySelector("#accept");if(accept)accept.onclick=()=>{depth+=60;setDepth();results[results.length-1].points=60;results[results.length-1].hit={tier:2,label:answer};revealAccepted(answer)} }
function revealAccepted(answer){const row=results[results.length-1];app.innerHTML=`<div class="hud"><span>Prompt ${question+1} of ${prompts.length}</span><span class="depth">${depth} m</span></div><span class="chip t2">George</span><div class="gain t2">+60 m</div><p class="sub">You said ${escapeHtml(answer)}. Counted as accepted.</p><div class="btns"><button id="next">${question===prompts.length-1?"See your results":"Next prompt"}</button></div>`;document.querySelector("#next").onclick=()=>{question++;question===prompts.length?finish():play()}}
function finish(){const possible=prompts.length*100;const rank=depth>=possible*.75?"Bouncing George":depth>=possible*.5?"George":depth>=possible*.3?"Britney":"Brat";app.innerHTML=`<div class="topline">${diver(72)}<div><p class="sub">You reached</p><h1>${depth} m</h1></div></div><p class="subtitle" style="margin-top:18px">${rank.toUpperCase()}</p><p class="lede">Out of a possible ${possible} m.</p><h2>Your dive</h2><div style="margin-top:14px">${results.map((result,index)=>`<div class="row"><span>${index+1}. ${escapeHtml(result.question)}<br><small>${result.answer?escapeHtml(result.answer):"No answer"}${result.hit?` · ${TIERS[result.hit.tier]?.name||"George"}`:" · Not on the list"}</small></span><b>${result.points} m</b></div>`).join("")}</div><div class="btns"><button id="again">Dive again</button><button class="ghost" id="home">Home</button></div>`;document.querySelector("#again").onclick=beginGame;document.querySelector("#home").onclick=home}
function editor(){const draft=structuredClone(prompts);function draw(){app.innerHTML=`<h2>Edit game</h2><p class="sub">Enter comma-separated answers for each rarity tier. Use / between spelling variants of the same answer.</p><div class="editor"><label>Seconds per question<input id="seconds" type="number" min="5" max="120" value="${seconds}"></label></div>${draft.map((prompt,index)=>`<div class="editor" data-index="${index}"><label>Question<input class="question" value="${escapeHtml(prompt.q)}"></label>${TIERS.map(tier=>`<label>${tier.name} answers<textarea class="${tier.id}" rows="2">${escapeHtml(prompt[tier.id]||"")}</textarea></label>`).join("")}<button class="ghost delete" type="button">Delete question</button></div>`).join("")}<div class="btns"><button class="ghost" id="add">Add question</button><button class="ghost" id="defaults">Restore defaults</button><button id="save">Save and play</button><button class="ghost" id="cancel">Cancel</button></div>`;document.querySelectorAll(".editor[data-index]").forEach(card=>{const index=Number(card.dataset.index);card.querySelector(".question").oninput=event=>draft[index].q=event.target.value;TIERS.forEach(tier=>card.querySelector(`.${tier.id}`).oninput=event=>draft[index][tier.id]=event.target.value);card.querySelector(".delete").onclick=()=>{draft.splice(index,1);draw()}});document.querySelector("#add").onclick=()=>{draft.push({q:"",...Object.fromEntries(TIERS.map(tier=>[tier.id,""]))});draw()};document.querySelector("#defaults").onclick=()=>{draft.splice(0,draft.length,...structuredClone(DEFAULTS));draw()};document.querySelector("#cancel").onclick=home;document.querySelector("#save").onclick=()=>{const valid=draft.filter(prompt=>prompt.q.trim());if(!valid.length){document.querySelector("h2").insertAdjacentHTML("afterend",'<p role="alert">Add at least one question.</p>');return}prompts=valid;seconds=Math.max(5,Math.min(120,Number(document.querySelector("#seconds").value)||25));try{localStorage.setItem(KEY,JSON.stringify({prompts,seconds}))}catch{}home()}}draw()}
home();
</script>
</body>
</html>
